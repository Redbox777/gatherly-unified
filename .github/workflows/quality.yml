name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: node --check app/interfaces/web/static/app.js
      - run: node --check app/interfaces/web/static/auth.js
      - run: node --check app/interfaces/web/static/diagnostics.js
      - run: pip-audit --strict
