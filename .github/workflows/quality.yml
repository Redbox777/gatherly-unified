name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: node --check app/interfaces/web/static/app.js
      - run: node --check app/interfaces/web/static/auth.js
      - run: node --check app/interfaces/web/static/diagnostics.js
      - run: npx --yes eslint@10.15.0 --config eslint.config.mjs app/interfaces/web/static/app.js app/interfaces/web/static/auth.js app/interfaces/web/static/diagnostics.js
      - run: python -m pip freeze --exclude-editable > /tmp/gatherly-audit-requirements.txt
      - run: pip-audit --strict -r /tmp/gatherly-audit-requirements.txt
